name: Validate research project
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'sql/**'
      - 'tests/**'
      - 'datasets/**'
      - '.github/workflows/validate.yml'
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_publication.py datasets/historical-v1
      - run: python scripts/verify_future.py
      - run: python scripts/verify_collections.py
