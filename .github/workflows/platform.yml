name: Validate scalable data platform
on:
  workflow_dispatch:
  push:
    paths:
      - 'btb_platform/**'
      - 'platform/**'
      - 'requirements-platform*'
      - 'datasets/**'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'btb_platform/**'
      - 'platform/**'
      - 'requirements-platform*'
      - '.github/workflows/platform.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: btb_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: btb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U btb_test -d btb_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BTB_TEST_DATABASE_URL: postgresql://btb_test:local-ci-only@127.0.0.1:5432/btb_test
      BTB_ADMIN_DATABASE_URL: postgresql://btb_test:local-ci-only@127.0.0.1:5432/btb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-platform.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s platform/tests -v
      - run: node --check platform/wordpress/explorer.js
      - run: php -l platform/wordpress/btb-data-platform.php
      - name: Build twice and require identical release identity
        run: |
          python -m btb_platform build --output work/one
          python -m btb_platform build --output work/two
          diff -r work/one work/two
      - name: Import full real release using PostgreSQL COPY
        run: |
          python -m btb_platform migrate
          python -m btb_platform load "$(find work/one -mindepth 1 -maxdepth 1 -type d | head -1)"
      - run: python platform/benchmark.py --output work/platform/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: platform-scale-evidence
          path: work/platform/benchmark.json
