# TLS terminates at the managed host / load balancer. Only expose this proxy, not the API container.
limit_req_zone $binary_remote_addr zone=btb_api:10m rate=2r/s;
proxy_cache_path /var/cache/nginx/btb levels=1:2 keys_zone=btb_cache:10m max_size=256m inactive=1h;
server {
    listen 8080;
    server_tokens off;
    location /health/ { proxy_pass http://api:8787; }
    location /v1/ {
        limit_req zone=btb_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
        proxy_cache btb_cache;
        proxy_cache_key "$request_method|$host|$request_uri|$http_origin";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        # Honor API Cache-Control; never cache errors or cookies.
        proxy_no_cache $upstream_http_set_cookie;
        add_header X-Data-Cache $upstream_cache_status always;
    }
    location / { return 404; }
}
